name: Check Qatar Upgrade Price

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chrome

      - name: Run price check
        env:
          BOOKING_REFERENCE: ${{ secrets.BOOKING_REFERENCE }}
          LAST_NAME: ${{ secrets.LAST_NAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_upgrade_price.py

      - name: Commit updated price log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add price_log.csv
          git diff --staged --quiet || git commit -m "Update price log [skip ci]"
          git push